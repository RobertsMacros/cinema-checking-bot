name: Cinema Digest

on:
  schedule:
    # Tuesday 5pm UTC = 6pm BST (UK summer) / 5pm GMT (UK winter)
    - cron: '0 17 * * 2'
  workflow_dispatch: # Allow manual trigger
    inputs:
      dry_run:
        description: 'Dry run: build the digest and its run report, send no email'
        type: boolean
        default: false

permissions:
  contents: read
  actions: write # for the keepalive step below

jobs:
  send-digest:
    runs-on: ubuntu-latest
    # The run has its own 8-minute time budget (config.RUN_TIME_BUDGET_SECONDS)
    # and always sends; this is only a backstop.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install headless Chromium (reads the Picturehouse pages)
        run: python -m playwright install --with-deps chromium

      - name: Restore OMDb cache
        uses: actions/cache@v5
        with:
          path: .cache
          key: omdb-cache-${{ github.run_number }}
          restore-keys: omdb-cache-

      - name: Run cinema digest
        env:
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
        run: python -m cinema_digest.main -v --report run-report

      # The digest, the Picturehouse pages it was built from and
      # listings_check.json, so each run's output can be checked afterwards.
      - name: Upload the run report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: digest-run-${{ github.run_number }}
          path: run-report
          retention-days: 30
          if-no-files-found: warn

      # The email has gone by now; this turns the run red if the digest left
      # out a film the Picturehouse pages showed, or fell back to Data Thistle.
      - name: Check the digest against the Picturehouse pages
        run: python -m cinema_digest.run_check run-report/listings_check.json

      - name: Keep the schedule alive
        # GitHub disables scheduled workflows in public repos after 60 days
        # without repository activity. Re-enabling this workflow through the
        # API (built-in token, no commits, no extra secrets) counts as activity.
        if: always() && github.event_name == 'schedule'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/cinema_digest.yml/enable"
